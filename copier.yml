# Copier template for a small Python application shipped as a container
# image: src/ layout, uv, ruff, pytest with a coverage gate, a hardened
# two-stage Dockerfile, and CI on GitHub or GitLab. See README.md.

_min_copier_version: "9.4.0"
_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.yml

# --- The project ------------------------------------------------------------

project_name:
  type: str
  help: Distribution, console script and image name (lowercase, hyphens)
  validator: >-
    {% if not (project_name | regex_search('^[a-z][a-z0-9]*(-[a-z0-9]+)*$')) %}
    Use lowercase letters, digits and single hyphens, starting with a letter.
    {% endif %}

package_name:
  type: str
  help: Import name of the package under src/
  default: "{{ project_name | replace('-', '_') }}"
  validator: >-
    {% if not (package_name | regex_search('^[a-z][a-z0-9_]*$')) %}
    Use a valid lowercase Python identifier.
    {% endif %}

description:
  type: str
  help: One-line description (pyproject, README, image label)

author:
  type: str
  help: Author and copyright holder
  default: Michele Bologna

license:
  type: str
  help: Licence (pyproject.toml, the image label and, for the first three, the LICENSE file)
  choices:
    MIT: MIT
    Apache-2.0: Apache-2.0
    GPL-3.0-only: GPL-3.0-only
    Another SPDX expression; the project writes LICENSE and LICENSES/: other
    None (all rights reserved; no LICENSE, no licence metadata): none
  default: MIT

license_expression:
  type: str
  help: >-
    SPDX licence expression, e.g. "MIT AND GPL-3.0-only". The project keeps
    LICENSE and the other licence texts in LICENSES/
  when: "{{ license == 'other' }}"
  validator: >-
    {% if not license_expression.strip() %}Give an SPDX expression.{% endif %}

forge:
  type: str
  help: Where the repository lives, which picks the CI
  choices:
    GitHub (mbologna/.github reusable workflows, images on GHCR): github
    GitLab (mbologna/ci-templates components, images on the project registry): gitlab
  default: github

notifications:
  type: bool
  help: Send notifications through an Apprise API server (apprise-notify-py, APPRISE_URL)
  default: true

sample_code:
  type: bool
  help: >-
    Generate the example package and its tests (answer no when adopting the
    template in a repository that already has its code)
  default: true

main_module:
  type: bool
  help: >-
    The package has a __main__.py, so `python -m <package>` runs main()
    (coverage leaves that file out)
  default: true

coverage_fail_under:
  type: int
  help: Minimum total test coverage, in percent ([tool.coverage.report] fail_under)
  default: 80

# --- The image --------------------------------------------------------------

base_variant:
  type: str
  help: Runtime base image (slim is glibc and takes every wheel; alpine is smaller)
  choices:
    python:<version>-slim (Debian): slim
    python:<version>-alpine (musl): alpine
  default: slim

entrypoint:
  type: str
  help: >-
    How the image starts: one program is the ENTRYPOINT; an image with several
    programs sets a default CMD, or none, and each deployment names one
  choices:
    ENTRYPOINT, one program (flags go in docker run arguments or Kubernetes args): entrypoint
    CMD, several programs with a default one (a deployment's command replaces it): cmd
    None, several programs and no default (each deployment sets its command): none
  default: entrypoint

script_target:
  type: str
  help: >-
    The function behind the {{ project_name }} console script, as
    module:function
  default: "{{ package_name }}:main"
  when: "{{ entrypoint != 'none' }}"
  validator: >-
    {% if not (script_target | regex_search('^[a-z_][a-z0-9_]*(\\.[a-z_][a-z0-9_]*)*:[a-zA-Z_][a-zA-Z0-9_]*$')) %}
    Use module:function, e.g. {{ package_name }}.cli:main.
    {% endif %}

# --- CI and delivery --------------------------------------------------------

smoke_cmd:
  type: str
  help: >-
    GitHub only: the docker-ci smoke test, a shell command that exits 0 in
    the built image without network or configuration
  default: >-
    {%- if entrypoint == 'none' -%}
    python -c 'import {{ package_name }}'
    {%- else -%}
    {{ project_name }} --help
    {%- endif %}
  when: "{{ forge == 'github' }}"

# Files the project owns after the first copy: an update never rewrites them.
_skip_if_exists:
  - README.md
  - AGENTS.md
  - CLAUDE.md
  - LICENSE

# No _tasks: copier refuses a template with tasks unless --trust is given,
# and Renovate's copier manager runs without it. uv.lock is generated by
# `uv lock` after a copy (and after an update that changes dependencies).

_message_after_copy: |
  {{ project_name }} is ready. Next:
    cd {{ _copier_conf.dst_path }}
    uv lock
    uv run pytest && uv run ruff check . && uv run ruff format --check .
    pre-commit install
  Release by merging Conventional Commits: the weekly auto-release run tags
  vX.Y.Z and that tag builds the image. pyproject.toml's version stays a
  placeholder (README.md, "Versions").
